<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Overlay - Multistream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;

      /* Opacidad de los mensajes. Ajustar aquí para todo el overlay. */
      --msg-bg-alpha: 0.85;
      --msg-border-alpha: 0.85;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #chat-container {
      position: fixed;
      top: 55px;
      bottom: 0px;
      left: 20px;
      right: 20px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1rem;
      /* min-height:0 es imprescindible: sin él, un hijo flex en columna no
         encoge y la lista desborda el contenedor en vez de hacer scroll */
      min-height: 0;
      flex: 0 1 auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
    }

    #messages::-webkit-scrollbar {
      display: none; /* Chrome/Safari/Opera */
    }

    /* Barra de estado de la pausa.
       En flujo normal (NO absolute) para que ocupe su propio espacio y
       nunca tape los mensajes. */
    /* La barra reserva su hueco SIEMPRE (visibility, no display).
       Si apareciera y desapareciera, la lista se desplazaría al pausar
       —justify-content es flex-end— y el mensaje bajo el cursor cambiaría
       solo, moviendo el resaltado a su vecino. */
    #chat-status-bar {
      flex-shrink: 0;
      margin-top: 8px;
      visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 7px 14px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 152, 0, 0.55);
      border-radius: 20px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      width: 100%;
      cursor: default;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    #chat-status-bar.visible {
      visibility: visible;
    }

    /* Sin pausa (OBS) la barra no puede aparecer nunca: no reservar su hueco */
    #chat-container.no-pause #chat-status-bar {
      display: none;
    }

    /* Borde blanco cuando hay un mensaje seleccionado, para que case
       con el resaltado del propio mensaje */
    #chat-status-bar.has-selection {
      border-color: rgba(255, 255, 255, 0.65);
    }

    #chat-status-bar .pause-label {
      color: #ffb74d;
      white-space: nowrap;
    }

    #chat-status-bar.has-selection .pause-label {
      color: #fff;
    }

    /* Acciones de la barra */
    .bar-action {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .bar-action.visible {
      display: inline-flex;
    }

    .bar-action:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .bar-action.danger:hover {
      background: rgba(244, 67, 54, 0.85);
      border-color: rgba(244, 67, 54, 1);
    }

    #chat-status-bar .separator {
      display: none;
      opacity: 0.35;
    }

    #chat-status-bar .separator.visible {
      display: inline;
    }

    #chat-status-bar .arrow {
      font-size: 9px;
    }

    .message {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 10px;
      padding: 14px;
      background: rgba(0, 0, 0, var(--msg-bg-alpha));
      border-radius: .25rem;
      animation: slideIn 0.3s ease-out;
      border-left: 4px solid rgba(var(--platform-rgb, 255, 255, 255), var(--msg-border-alpha));
      transition: box-shadow 0.15s ease, border-left-color 0.15s ease;
    }

    /* Mensaje enfocado o seleccionado: borde blanco y se tapa el de plataforma.
       El contorno va con box-shadow y NO con border: un border real cambiaría
       las dimensiones del mensaje y daría un salto de layout al pasar el cursor.

       La clase .hovered la pone el JS en vez de usar :hover, por dos razones:
       el resaltado siempre coincide con el mensaje que realmente dispara la
       pausa, y con ?pausable=false no se resalta nada (no sería interactivo). */
    .message.hovered {
      border-left-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
      cursor: pointer;
    }

    .message.selected {
      border-left-color: #fff;
      box-shadow: 0 0 0 2px #fff, 0 0 12px rgba(255, 255, 255, 0.35);
    }

    /* Colores de plataforma como tripletas RGB para poder aplicarles alfa */
    .message.twitch {
      display: flex;
      --platform-rgb: 145, 70, 255;
    }

    .message.kick {
      --platform-rgb: 83, 252, 24;
    }

    .message.youtube {
      --platform-rgb: 255, 0, 0;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
        transform: translateY(-10px);
      }
    }

    .message.removing {
      animation: fadeOut 0.3s ease-out forwards;
    }

    .platform-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .platform-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .message-content {
      flex: 1;
      min-width: 0;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      flex-wrap: wrap;
      gap: .5rem;
    }

    .username {
      font-weight: 700;
      font-size: 14px;
      margin-right: 8px;
    }

    .badges {
      display: inline-flex;
      gap: 4px;
      margin-right: 6px;
      vertical-align: middle;
      align-items: center;
    }

    .badge {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
      font-weight: 600;
    }

    .badge-image {
      height: 18px;
      width: auto;
      vertical-align: middle;
    }

    .badge.subscriber {
      background: #9146FF;
      color: white;
    }

    .badge.moderator {
      background: #ffffff; /* fallback sólido */
      background: rgba(255, 255, 255, 0.3);
      color: #000;
    }

    .badge.vip {
      background: #ffffff; /* fallback sólido */
      background: rgba(255, 255, 255, 0.3);
      color: #000;
    }

    .text {
      font-size: 15px;
      color: #fff;
      word-wrap: break-word;
      line-height: 1.4;
      display: inline;
    }

    .message-text {
      display: inline-flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 2px;
      font-size: 15px;
      color: #fff;
      line-height: 1.4;
    }

    .emote {
      display: inline-block;
      height: 28px;
      max-height: 28px;
      vertical-align: middle;
      margin: 0 2px;
    }

    .text-part {
      display: inline;
      color: #fff;
    }

    /* Estado de conexión */
    #connection-status {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    #connection-status.connected {
      background: rgba(0, 200, 83, 0.9);
      color: #fff;
    }

    #connection-status.disconnected {
      background: rgba(244, 67, 54, 0.9);
      color: #fff;
    }

    #connection-status.connecting {
      background: rgba(255, 152, 0, 0.9);
      color: #fff;
    }

    /* Ocultar en OBS después de un tiempo */
    #connection-status.hide-in-obs {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="connection-status" class="connecting">Conectando...</div>

  <div id="chat-container">
    <div id="messages"></div>
    <!-- div y no button: dentro van botones, y no se pueden anidar -->
    <div id="chat-status-bar">
      <span class="pause-label">⏸ Chat pausado</span>
      <span class="separator">·</span>
      <button class="bar-action" id="bar-pending" type="button">
        <span class="arrow">▼</span>
        <span class="pending-text">0 mensajes nuevos</span>
      </button>
      <button class="bar-action danger" id="bar-delete" type="button">🗑 Borrar</button>
      <button class="bar-action" id="bar-resume" type="button">✕ Reanudar</button>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURACIÓN
    // ============================================
    const WS_URL = `ws://${globalThis.location.host}`;

    // Detectar parámetro de URL para scroll pausable (activo por defecto)
    const urlParams = new URLSearchParams(globalThis.location.search);
    const PAUSABLE_ENABLED = urlParams.get('pausable') !== 'false';
    // Persistir mensajes (mantener historial completo)
    const PERSIST_MESSAGES = urlParams.get('persist') === 'true';


    // Configuración según modo
    const MAX_MESSAGES_PERSIST = 100;
    const MAX_MESSAGES_TRANSIENT = 15;
    const MAX_MESSAGES = PERSIST_MESSAGES ? MAX_MESSAGES_PERSIST : MAX_MESSAGES_TRANSIENT;
    // Tope de seguridad mientras el chat está pausado: no se recorta nada
    // hasta llegar aquí, para no borrar lo que el usuario está leyendo
    const MAX_MESSAGES_PAUSED = 300;
    const MESSAGE_LIFETIME_MS = 60000; // 60 segundos (solo aplica si PERSIST_MESSAGES = false)
    const EXPIRY_SWEEP_INTERVAL_MS = 1000; // cada cuánto se buscan mensajes caducados
    const HIDE_STATUS_AFTER_MS = 5000; // Ocultar status después de 5s
    const RECONNECT_MAX_ATTEMPTS = 10;
    const RECONNECT_BASE_DELAY_MS = 1000;
    const RECONNECT_MAX_DELAY_MS = 30000;

    // Iconos de plataformas
    const PLATFORM_ICONS = {
      twitch: '/icons/twitch.png',
      kick: '/icons/kick.png',
      youtube: '/icons/youtube.png'
    };

    // ============================================
    // ELEMENTOS DOM
    // ============================================
    const messagesContainer = document.getElementById('messages');
    const connectionStatus = document.getElementById('connection-status');
    const statusBar = document.getElementById('chat-status-bar');
    const pendingText = statusBar.querySelector('.pending-text');
    const separator = statusBar.querySelector('.separator');
    const barPending = document.getElementById('bar-pending');
    const barDelete = document.getElementById('bar-delete');
    const barResume = document.getElementById('bar-resume');

    // Control de rate limiting para mensajes
    let messageQueue = [];
    let isProcessingQueue = false;
    const MESSAGE_PROCESS_INTERVAL = 50; // ms entre mensajes (evita saturación)

    // Estado de pausa: tres causas independientes porque se sueltan distinto.
    // El hover se suelta solo al salir del mensaje; la selección por click
    // solo se libera desde la barra inferior.
    let hoverPaused = false;         // el cursor está sobre un mensaje
    let scrollPaused = false;        // el usuario scrolleó hacia arriba
    let selectedMessageId = null;    // mensaje fijado con click
    let pauseStartedAt = null;       // para congelar el reloj de caducidad
    let isUserScrolling = false;
    let scrollTimeout = null;
    let pendingMessagesCount = 0;

    function isPaused() {
      return PAUSABLE_ENABLED && (hoverPaused || scrollPaused || selectedMessageId !== null);
    }

    // ============================================
    // WEBSOCKET
    // ============================================
    let ws = null;
    let reconnectAttempts = 0;

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log('✅ Conectado al servidor');
        updateStatus('connected', 'Conectado');
        reconnectAttempts = 0;

        // Ocultar status después de un tiempo
        setTimeout(() => {
          connectionStatus.classList.add('hide-in-obs');
        }, HIDE_STATUS_AFTER_MS);
      };

      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);

          // Los avisos de control llevan `type`; los mensajes de chat no.
          // Hay que ramificar antes de encolar o se renderizarían como
          // un mensaje roto.
          if (message.type === 'delete') {
            removeMessageById(message.id);
            return;
          }

          // Agregar a cola en lugar de procesar inmediatamente
          messageQueue.push(message);
          processMessageQueue();
        } catch (e) {
          console.error('Error parsing message:', e);
        }
      };

      ws.onclose = () => {
        console.log('❌ Desconectado del servidor');
        updateStatus('disconnected', 'Desconectado');
        connectionStatus.classList.remove('hide-in-obs');

        // Intentar reconectar
        if (reconnectAttempts < RECONNECT_MAX_ATTEMPTS) {
          reconnectAttempts++;
          const delay = Math.min(RECONNECT_BASE_DELAY_MS * Math.pow(2, reconnectAttempts), RECONNECT_MAX_DELAY_MS);
          console.log(`Reconectando en ${delay / 1000}s... (intento ${reconnectAttempts})`);
          updateStatus('connecting', `Reconectando (${reconnectAttempts})...`);
          setTimeout(connect, delay);
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };
    }

    function updateStatus(state, text) {
      connectionStatus.className = state;
      connectionStatus.textContent = text;
    }

    // ============================================
    // COLA DE MENSAJES (rate limiting)
    // ============================================
    function processMessageQueue() {
      if (isProcessingQueue || messageQueue.length === 0) return;
      
      isProcessingQueue = true;
      
      function processNext() {
        if (messageQueue.length === 0) {
          isProcessingQueue = false;
          return;
        }
        
        const message = messageQueue.shift();
        addMessage(message);
        
        // Procesar siguiente mensaje después de un breve delay
        if (messageQueue.length > 0) {
          setTimeout(processNext, MESSAGE_PROCESS_INTERVAL);
        } else {
          isProcessingQueue = false;
        }
      }
      
      processNext();
    }

    // ============================================
    // CONTROL DE SCROLL
    // ============================================
    function isScrolledToBottom() {
      const threshold = 50; // Píxeles de tolerancia
      return messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < threshold;
    }

    function scrollToBottom(smooth = true) {
      messagesContainer.scrollTo({
        top: messagesContainer.scrollHeight,
        behavior: smooth ? 'smooth' : 'instant'
      });
      resumeChat();
    }

    /**
     * Reanudar el chat: se acabaron las dos causas de pausa.
     * Devuelve al reloj de caducidad el tiempo que estuvo congelado y
     * recorta de golpe lo que no se recortó durante la pausa.
     */
    function resumeChat() {
      hoverPaused = false;
      scrollPaused = false;
      isUserScrolling = false;
      pendingMessagesCount = 0;
      clearSelection();

      // pauseStartedAt es la fuente de verdad de "veníamos de una pausa":
      // los flags pueden haber sido limpiados ya por quien nos llama
      if (pauseStartedAt !== null) {
        shiftExpiries(Date.now() - pauseStartedAt);
        pauseStartedAt = null;
      }

      updateStatusBar();
      trimMessages();
    }

    /**
     * Marcar el chat como pausado por una de las tres causas.
     * @param {'hover'|'scroll'|'select'} reason
     */
    function pauseChat(reason) {
      if (!PAUSABLE_ENABLED) return;

      // Arrancar el cronómetro de la pausa solo la primera vez
      if (!isPaused()) pauseStartedAt = Date.now();

      if (reason === 'hover') hoverPaused = true;
      else if (reason === 'scroll') scrollPaused = true;
      // 'select': el id lo fija toggleSelection, aquí solo arranca el reloj

      updateStatusBar();
    }

    /** Quitar la selección actual, si la hay */
    function clearSelection() {
      if (selectedMessageId === null) return;
      const el = messagesContainer.querySelector('.message.selected');
      if (el) el.classList.remove('selected');
      selectedMessageId = null;
    }

    /** Seleccionar un mensaje (pausa fija). Volver a clicarlo lo deselecciona. */
    function toggleSelection(messageEl) {
      const id = messageEl.dataset.id;

      if (selectedMessageId === id) {
        clearSelection();
        // Al soltar la selección, si nada más nos pausa, reanudar
        if (!isPaused()) {
          resumeChat();
          scrollToBottom(true);
        } else {
          updateStatusBar();
        }
        return;
      }

      clearSelection();
      // pauseChat arranca el cronómetro solo si no estábamos ya pausados,
      // así que se llama antes de fijar el id
      pauseChat('select');
      selectedMessageId = id;
      messageEl.classList.add('selected');
      updateStatusBar();
    }

    function updateStatusBar() {
      if (!PAUSABLE_ENABLED) return;

      if (!isPaused()) {
        statusBar.classList.remove('visible', 'has-selection');
        barPending.classList.remove('visible');
        barDelete.classList.remove('visible');
        barResume.classList.remove('visible');
        separator.classList.remove('visible');
        return;
      }

      statusBar.classList.add('visible');

      const hasSelection = selectedMessageId !== null;
      const hasPending = pendingMessagesCount > 0;

      statusBar.classList.toggle('has-selection', hasSelection);

      // Con un mensaje seleccionado la barra pasa a ser el sitio de las
      // acciones: es la única forma de soltar esta pausa
      barDelete.classList.toggle('visible', hasSelection);
      barResume.classList.toggle('visible', hasSelection);

      // El contador de pendientes solo estorba cuando hay selección
      barPending.classList.toggle('visible', hasPending && !hasSelection);
      separator.classList.toggle('visible', hasSelection || hasPending);

      statusBar.querySelector('.pause-label').textContent =
        hasSelection ? '⏸ Mensaje seleccionado' : '⏸ Chat pausado';

      if (hasPending) {
        pendingText.textContent = pendingMessagesCount === 1
          ? '1 mensaje nuevo'
          : `${pendingMessagesCount} mensajes nuevos`;
      }
    }

    // Sin pausa la barra nunca aparece: se saca del layout para no
    // desperdiciar alto en OBS
    if (!PAUSABLE_ENABLED) {
      document.getElementById('chat-container').classList.add('no-pause');
    }

    // Solo agregar listeners si la pausa está habilitada
    if (PAUSABLE_ENABLED) {
      // Detectar scroll del usuario
      messagesContainer.addEventListener('scroll', () => {
        if (isUserScrolling) return; // Ignorar si estamos en medio de un scroll programático

        if (isScrolledToBottom()) {
          // Solo el scroll deja de pausar; si el cursor sigue encima, seguimos pausados
          scrollPaused = false;
          if (!isPaused()) resumeChat();
          else updateStatusBar();
        } else {
          pauseChat('scroll');
        }
      });

      // Detectar cuando el usuario empieza a scrollear manualmente
      messagesContainer.addEventListener('wheel', () => {
        isUserScrolling = true;
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
          isUserScrolling = false;
          if (!isScrolledToBottom()) {
            pauseChat('scroll');
          }
        }, 150);
      });

      // Pausar al pasar el cursor SOBRE UN MENSAJE.
      // Se usa 'mouseover' (burbujea) en vez de 'mouseenter' (no burbujea)
      // para poder delegar y distinguir mensaje de hueco entre mensajes.
      messagesContainer.addEventListener('mouseover', (event) => {
        const messageEl = event.target.closest('.message');
        if (!messageEl) return;

        setHoveredMessage(messageEl);
        pauseChat('hover');
      });

      // Soltar la pausa por hover al salir del mensaje, sin esperar a salir
      // de la lista entera.
      messagesContainer.addEventListener('mouseout', (event) => {
        if (!event.target.closest('.message')) return;

        // Al ir del mensaje A al B, el 'mouseout' de A dispara ANTES que el
        // 'mouseover' de B. Sin esta guarda se reanudaría (con salto al fondo)
        // para volver a pausar al instante: un parpadeo.
        if (event.relatedTarget?.closest?.('.message')) return;

        releaseHoverPause();
      });

      // Red de seguridad: cubre salir por el borde o relatedTarget nulo
      messagesContainer.addEventListener('mouseleave', releaseHoverPause);

      // Click en un mensaje: lo selecciona y fija la pausa
      messagesContainer.addEventListener('click', (event) => {
        const messageEl = event.target.closest('.message');
        if (messageEl) toggleSelection(messageEl);
      });

      // Acciones de la barra
      barPending.addEventListener('click', () => scrollToBottom(true));

      barResume.addEventListener('click', () => {
        resumeChat();
        scrollToBottom(true);
      });

      barDelete.addEventListener('click', () => {
        if (selectedMessageId !== null) deleteMessage(selectedMessageId);
      });
    }

    /**
     * Terminar la pausa por hover. No toca la pausa por scroll ni la
     * selección: esas se sueltan por su cuenta.
     */
    /** Mover el resaltado al mensaje bajo el cursor */
    function setHoveredMessage(messageEl) {
      const previous = messagesContainer.querySelector('.message.hovered');
      if (previous === messageEl) return;
      if (previous) previous.classList.remove('hovered');
      if (messageEl) messageEl.classList.add('hovered');
    }

    function releaseHoverPause() {
      if (!PAUSABLE_ENABLED) return;

      setHoveredMessage(null);
      hoverPaused = false;

      if (isPaused()) {
        updateStatusBar();
      } else {
        resumeChat();
        scrollToBottom(true);
      }
    }

    // ============================================
    // MENSAJES
    // ============================================
    function addMessage(msg) {
      const messageEl = document.createElement('div');
      messageEl.className = `message ${msg.platform}`;
      messageEl.dataset.id = msg.id;

      // Renderizar badges: imágenes para ambas plataformas
      let badgesHtml = '';
      let hasBadges = false;
      
      if (msg.badgeImages && msg.badgeImages.length > 0) {
        // Usar badgeImages (Twitch y Kick con SVGs)
        badgesHtml = msg.badgeImages.map(badge => 
          `<img class="badge-image" src="${badge.url}" alt="${escapeHtml(badge.type)}" title="${escapeHtml(badge.text || badge.type)}" />`
        ).join('');
        hasBadges = true;
      } else if (msg.isModerator || msg.isVIP || msg.isSubscriber) {
        // Fallback: badges de texto solo si hay alguna
        if (msg.isModerator) badgesHtml += '<span class="badge moderator">MOD</span>';
        if (msg.isVIP) badgesHtml += '<span class="badge vip">VIP</span>';
        if (msg.isSubscriber) badgesHtml += '<span class="badge subscriber">SUB</span>';
        hasBadges = true;
      }

      // Renderizar parts (texto + emotes)
      const messageContentHtml = renderMessageParts(msg.parts || [{ type: 'text', text: msg.raw || msg.message || '' }]);

      const platformIcon = PLATFORM_ICONS[msg.platform] || '';
      
      // Solo mostrar span de badges si hay badges
      const badgesSpan = hasBadges ? `<span class="badges">${badgesHtml}</span>` : '';

      messageEl.innerHTML = `
                <div class="platform-icon ${msg.platform}">
                    <img src="${platformIcon}" alt="${msg.platform}" />
                </div>
                <div class="message-content">
                    ${badgesSpan}
                    <span class="username" style="color: ${msg.color}">${escapeHtml(msg.username)}</span>
                    <span class="message-text">${messageContentHtml}</span>
                </div>
            `;

      // Marcar cuándo caduca. Lo consume el barrido periódico, que respeta
      // la pausa (antes era un setTimeout por mensaje que la ignoraba)
      if (!PERSIST_MESSAGES) {
        messageEl.dataset.expiresAt = String(Date.now() + MESSAGE_LIFETIME_MS);
      }

      messagesContainer.appendChild(messageEl);

      if (isPaused()) {
        // Pausado: el mensaje entra pero la vista no se mueve
        pendingMessagesCount++;
        updateStatusBar();
      } else {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      trimMessages();
    }

    /**
     * Recortar mensajes antiguos.
     * Mientras el chat está pausado no se recorta nada hasta el tope de
     * seguridad, para no borrar lo que el usuario está leyendo. Si se llega
     * al tope, se compensa el scroll para que la vista no dé un salto.
     */
    function trimMessages() {
      const paused = isPaused();
      const limit = paused ? MAX_MESSAGES_PAUSED : MAX_MESSAGES;

      if (messagesContainer.children.length <= limit) return;

      const heightBefore = messagesContainer.scrollHeight;

      while (messagesContainer.children.length > limit) {
        const oldMessage = messagesContainer.firstElementChild;
        if (!oldMessage) break;

        // Si el recorte se lleva el mensaje seleccionado, soltar la selección:
        // si no, la pausa quedaría fijada sin nada que mostrar en la barra
        if (oldMessage.dataset.id === selectedMessageId) {
          selectedMessageId = null;
        }

        oldMessage.remove(); // Eliminación directa sin animación
      }

      if (paused) {
        messagesContainer.scrollTop -= (heightBefore - messagesContainer.scrollHeight);
      }
    }

    /**
     * Desplazar la caducidad de todos los mensajes por el tiempo que el
     * chat estuvo pausado, para que la pausa congele el reloj de verdad
     * en vez de hacer que todo caduque de golpe al reanudar.
     * @param {number} deltaMs
     */
    function shiftExpiries(deltaMs) {
      if (PERSIST_MESSAGES || deltaMs <= 0) return;

      for (const el of messagesContainer.children) {
        const expiresAt = Number(el.dataset.expiresAt);
        if (expiresAt) el.dataset.expiresAt = String(expiresAt + deltaMs);
      }
    }

    /**
     * Barrido único de mensajes caducados, en lugar de un temporizador por
     * mensaje. No borra nada mientras el chat está pausado.
     */
    function sweepExpiredMessages() {
      if (PERSIST_MESSAGES || isPaused()) return;

      const now = Date.now();
      // Se copia porque children es una colección viva y vamos a borrar de ella
      for (const el of [...messagesContainer.children]) {
        const expiresAt = Number(el.dataset.expiresAt);
        if (expiresAt && now >= expiresAt && !el.classList.contains('removing')) {
          removeMessage(el);
        }
      }
    }

    function renderMessageParts(parts) {
      return parts.map(part => {
        if (part.type === 'emote') {
          return `<img class="emote" src="${part.url}" alt="${escapeHtml(part.name)}" title="${escapeHtml(part.name)}" loading="lazy" />`;
        } else {
          return `<span class="text-part">${escapeHtml(part.text)}</span>`;
        }
      }).join('');
    }

    function removeMessage(element) {
      element.classList.add('removing');
      setTimeout(() => {
        if (element.parentNode) {
          element.remove();
        }
      }, 300);
    }

    /**
     * Quitar un mensaje del DOM por id. Lo dispara el aviso de borrado del
     * servidor, así que corre en TODOS los clientes (navegador y OBS).
     * @param {string} id
     */
    function removeMessageById(id) {
      const el = messagesContainer.querySelector(`[data-id="${CSS.escape(id)}"]`);
      if (!el) return;

      // Si era el seleccionado, se suelta la pausa que mantenía
      if (selectedMessageId === id) {
        selectedMessageId = null;
        if (!isPaused()) resumeChat();
        else updateStatusBar();
      }

      removeMessage(el);
    }

    /**
     * Pedir al servidor que borre un mensaje. El servidor lo saca del
     * historial y avisa a todos los clientes; el borrado local llega por ahí.
     * @param {string} id
     */
    async function deleteMessage(id) {
      try {
        const res = await fetch(`/api/messages/${encodeURIComponent(id)}`, { method: 'DELETE' });

        if (!res.ok) {
          console.error(`No se pudo borrar el mensaje ${id}:`, res.status);
          // El mensaje puede haber salido ya del historial del servidor
          // (supera MAX_HISTORY); se quita en local para no dejarlo colgado
          removeMessageById(id);
        }
      } catch (e) {
        console.error('Error al borrar el mensaje:', e);
        removeMessageById(id);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================
    // INICIAR
    // ============================================
    if (!PERSIST_MESSAGES) {
      setInterval(sweepExpiredMessages, EXPIRY_SWEEP_INTERVAL_MS);
    }

    connect();
  </script>
</body>

</html>
